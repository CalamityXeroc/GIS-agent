id: project_raster
name: 栅格投影变换
description: 把栅格重投影到目标坐标系（含像元大小设置），用于让栅格与矢量分析使用同一坐标系。
domain: raster
category: raster
triggers: [栅格投影, 重投影栅格, project raster, 栅格坐标系, 像元大小设置]
preconditions:
  - 已知目标坐标系（与矢量一致时才可做分区统计/叠加）
params:
  input_path:
    type: string
    required: true
    description: 输入栅格
  output_path:
    type: string
    required: true
    description: 输出栅格
  target_srid:
    type: integer
    default: 4527
    description: 目标 EPSG；华北京津一带常用 4527（CGCS2000 3 度带 CM 117E）
  cell_size:
    type: number
    default: 0
    description: 输出像元大小（米）；0 表示自动保持输入像元大小
steps:
  - 校验输入与目标坐标系
  - ProjectRaster（可指定像元大小）
  - 返回新旧坐标系与像元大小
code_template: |
  import arcpy, os
  arcpy.env.overwriteOutput = True

  input_path = {{input_path}}
  output_path = {{output_path}}
  target_srid = int({{target_srid}})
  cell_size = float({{cell_size}})

  if not arcpy.Exists(input_path):
      raise ValueError(f"输入栅格不存在: {input_path}")
  src_sr = arcpy.Describe(input_path).spatialReference
  tgt_sr = arcpy.SpatialReference(target_srid)
  if src_sr.factoryCode == target_srid:
      print(f"栅格已是目标坐标系（EPSG:{target_srid}），直接复制")
      if arcpy.Exists(output_path):
          arcpy.management.Delete(output_path)
      arcpy.management.CopyRaster(input_path, output_path)
  else:
      out_folder = os.path.dirname(output_path)
      if str(out_folder).lower().endswith(".gdb"):
          if not arcpy.Exists(out_folder):
              arcpy.management.CreateFileGDB(os.path.dirname(out_folder), os.path.basename(out_folder)[:-4])
      elif out_folder and not os.path.isdir(out_folder):
          os.makedirs(out_folder, exist_ok=True)
      if arcpy.Exists(output_path):
          arcpy.management.Delete(output_path)
      arcpy.management.ProjectRaster(
          in_raster=input_path,
          out_raster=output_path,
          out_coor_system=tgt_sr,
          resampling_type="BILINEAR",
          cell_size=cell_size if cell_size > 0 else None,
      )

  r = arcpy.Raster(output_path)
  set_result({"output": output_path, "source_wkid": src_sr.factoryCode, "target_wkid": target_srid,
              "cell_size": r.meanCellWidth, "min": r.minimum, "max": r.maximum,
              "size": [r.width, r.height]})
  print(f"ProjectRaster done: wkid {src_sr.factoryCode} -> {target_srid}, cell={r.meanCellWidth:.3f}")
validation:
  - type: raster_exists
    path: "{{output_path}}"
pitfalls:
  - 重采样会平滑细节（BILINEAR）；类别栅格应改用 NEAREST。
  - 像元大小改变会改变总量（例如 SUM 会随像元数变化），分摊/统计前要固定像元大小。
examples:
  - "把 UTM 50N 的人口密度栅格投影到 CGCS2000 3 度带 117E"
  - "统一栅格与矢量的坐标系"