  - type: feature_count_gt
    path: "{{output_table}}"
    value: 0
pitfalls:
  - 分区输入给的是 **.gpkg / .gdb / 文件夹**（容器）而不是图层：arcpy 后端只在容器里恰好一个要素类时自动取用，多个图层会明确报错要你指明图层（如 `zones.gpkg/counties`）；GDAL 后端没给 layer 时默认读第一层、只留一条 warning —— 两边取舍不同，跨后端比数时一律显式指明图层。
  - 分区字段必须是整型（arcpy 后端）：浮点/文本（如社区 BSM）会被自动转成整型副本后统计（至少需能无损转整数）；GDAL 后端不需要整型，文本分区字段只有 GDAL 后端能用。
  - 分区字段建议用唯一 ID；用名称可能因重名合并（两端都按分区值分组，重名合并成一行）。
  - 空 zone_field 时**不要写死 `OBJECTID`** 当输出列名：分区列的真实名字由「分区源的 OID 字段名」与「输出格式」共同决定，结果里的 `zone_field` 就是它。实测（Pro 3.6）：.gdb 要素类 + .dbf 输出 → `OBJECTID`；.gdb 要素类 + .gdb 表 → `OBJECTID_1`（OBJECTID 让给表自身 OID）；.gpkg 图层 + .dbf 输出 → `fid_`（dBASE 的保留名 FID 被加下划线）；.gpkg 图层 + .gdb 表 → `fid`；.shp 同理是 `FID` 系（且 .shp 的 OID 从 0 开始，输出的分区值就是 0..N-1）。下游 join 用结果里的 `zone_field`，别硬编码（GDAL 后端写 .csv/.gpkg 时一律叫 `OBJECTID`）。
  - 栅格有 NoData 时统计结果会受影响：COUNT/AREA 只数有效像元（nodata 不算），两端一致。
  - 输出是库内表，不是文件系统路径（arcpy 后端）：判定存在要用 arcpy.Exists（file_exists 断言会误判）。
  - 多统计量（SUM;MEAN）在 arcpy 后端是逐项各跑一遍 ZonalStatisticsAsTable（N 个类型 = N 次遍历栅格），大栅格上耗时按倍数涨；GDAL 后端一次遍历出全部列。
  - GDAL 后端只能写 .csv / .gpkg 表：.dbf 与 .gdb 表请用 arcpy 后端（会给明确报错，不会静默换格式）。
  - GDAL 后端的 .csv 是 UTF-8（带 BOM）：用 pandas 读（encoding='utf-8-sig'）；OGR/pyogrio 在 GBK 区域设置下按 GBK 解 .csv 会报解码错，要程序化读取请用 .gpkg。
  - GDAL 后端覆盖已有 .gpkg 时会整文件重写：同一个 .gpkg 里的其他图层会丢。
  - 分区边界像元的归属规则两端不同（**不只是「边界正好压在格心」那一种**）：GDAL 与 arcpy 各自按自己的口径决定边界像元算不算，5 m 级小面上 COUNT 不保证相等——实测 2341 社区 × 5 m 只有 **10.0%** 的分区严格相等（与 DAIR-87 基线一致），偏移半像元的 9×9 探针 arcpy COUNT=64 vs GDAL 90。浮点量按容差卡：MEAN 实测中位差 **0.40%**、p95 **2.33%**（1 km 大面仍是 1e-7 级）；跨后端验收按 MEAN 相对差 **p95 ≤ 3%** 卡（实测 2.33%），**逐分区卡 3% 不成立**——2.74% 的分区会超、最大 14.2%，100–4999 px 的分区也会超（只有 ≥5000 px 才稳定在 **~1.3%** 以内，实测 max 1.3131%）；逐分区严格比对按 max ~14% 卡，或先按分区像元数过滤。不要按 COUNT 相等或 1e-6 卡。
  - 分区在栅格外：个别分区在外时两端都跳过该分区、不出行（不报错）；**所有**分区都在栅格外（分区范围与栅格范围完全不重叠）时 arcpy 整体报错（ERROR 010568 范围无效），GDAL 跳过全部分区、写出 0 行表，随后栽在 feature_count_gt（count=0）。
  - AREA 是「有效像元覆盖的面积」（COUNT×像元面积），不是分区面积；地理坐标系下单位是度²，没有面积含义。
  - 很慢：缓冲区（数千个）分区统计 5 米栅格通常要十几分钟，调用时把 timeout_seconds 调到 1800 以上。
  - 栅格输入给 `.gdb` 里的栅格（arcpy 侧交出来的 `x.gdb\层名`）两端都能读：GDAL 侧翻成 `OpenFileGDB:"x.gdb":层名`，只给 `.gdb` 且库里恰好一份栅格时自动取用、多份报错要你指明（如 `x.gdb\层名`）。判据是「能不能打开」，不是 `os.path.exists`（库里的栅格不是文件系统路径）。
