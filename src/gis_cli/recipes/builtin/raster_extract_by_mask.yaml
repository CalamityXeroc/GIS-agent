id: raster_extract_by_mask
name: 按掩膜提取栅格
description: 用面/栅格掩膜裁剪栅格，只保留掩膜范围内的像元（范围外置 NoData）。用于把栅格限定到研究区。
domain: raster
category: raster
triggers: [掩膜提取, extract by mask, 栅格裁剪, 限定范围, 掩膜]
preconditions:
  - 掩膜与栅格坐标系一致（不一致先投影掩膜）
params:
  raster_path:
    type: string
    required: true
    description: 输入栅格
  mask_path:
    type: string
    required: true
    description: 掩膜（面要素或栅格）
  output_path:
    type: string
    required: true
    description: 输出栅格
steps:
  - 校验坐标系
  - ExtractByMask
  - 返回有效像元数
code_template: |
  import arcpy, os
  arcpy.env.overwriteOutput = True

  raster_path = {{raster_path}}
  mask_path = {{mask_path}}
  output_path = {{output_path}}

  for p in (raster_path, mask_path):
      if not arcpy.Exists(p):
          raise ValueError(f"输入不存在: {p}")
  rsr = arcpy.Describe(raster_path).spatialReference.name
  msr = arcpy.Describe(mask_path).spatialReference.name
  if rsr != msr:
      raise ValueError(f"坐标系不一致（raster={rsr}, mask={msr}），请先统一")

  out_folder = os.path.dirname(output_path)
  if str(out_folder).lower().endswith(".gdb"):
      if not arcpy.Exists(out_folder):
          arcpy.management.CreateFileGDB(os.path.dirname(out_folder), os.path.basename(out_folder)[:-4])
  elif out_folder and not os.path.isdir(out_folder):
      os.makedirs(out_folder, exist_ok=True)
  if arcpy.Exists(output_path):
      arcpy.management.Delete(output_path)

  arcpy.sa.ExtractByMask(raster_path, mask_path).save(output_path)
  r = arcpy.Raster(output_path)
  set_result({"output": output_path, "min": r.minimum, "max": r.maximum,
              "cell_size": r.meanCellWidth, "size": [r.width, r.height]})
  print(f"ExtractByMask done: {r.width}x{r.height}, range={r.minimum}~{r.maximum}")
validation:
  - type: raster_exists
    path: "{{output_path}}"
pitfalls:
  - 掩膜范围外的像元变成 NoData（不是 0）；后续求和/平均会自动忽略。
  - 掩膜坐标系不一致会导致范围错位，必须先统一。
examples:
  - "把人口密度栅格裁剪到研究区范围"
