id: graduated_colors_map
name: 分级设色专题图（含四要素）
description: 使用已验证的布局代码生成分级设色专题图，自动包含图名、图例、比例尺、指北针，导出 JPG，并保存可继续编辑的 .aprx 工程（样式与布局已落盘）。
domain: cartography
triggers: [专题图, 制图, 分级设色, choropleth, 地图, 图例, 指北针, 比例尺]
preconditions:
  - 已通过 catalog_query 确认分级字段名存在且为数值型
  - 输入为面要素
params:
  input_path:
    type: string
    required: true
    description: 输入面要素路径
  field_name:
    type: string
    required: true
    description: 分级字段名（必须是数据中真实存在的数值字段）
  output_path:
    type: string
    required: true
    description: 输出 JPG 路径
  title:
    type: string
    default: ""
    description: 地图标题，空则自动生成
  color_ramp_name:
    type: string
    default: ""
    description: 色带名（如 Greens、YlOrRd、Reds），空则自动
  page_width:
    type: integer
    default: 297
    description: 页面宽 mm
  page_height:
    type: integer
    default: 420
    description: 页面高 mm
  aprx_path:
    type: string
    default: ""
    description: 工程文件(.aprx)保存路径；空则与输出图同名同目录（output/xx.jpg → output/xx.aprx）
steps:
  - 调用 build_graduated_colors_code 生成完整布局代码
  - 执行并导出 JPG，同时保存 .aprx 工程（样式/布局已落盘）
  - 检查图片非空白、工程文件已生成
code_template: |
  import arcpy
  from gis_cli.arcpy_bridge import build_graduated_colors_code

  input_path = {{input_path}}
  field_name = {{field_name}}
  output_path = {{output_path}}

  if not arcpy.Exists(input_path):
      raise ValueError(f"输入数据不存在: {input_path}")

  fields = [f.name for f in arcpy.ListFields(input_path)]
  if field_name not in fields:
      raise ValueError(f"字段不存在: {field_name}；可用字段: {fields}")

  code = build_graduated_colors_code(
      input_path=input_path,
      field_name=field_name,
      output_path=output_path,
      title={{title}},
      color_ramp_name={{color_ramp_name}},
      page_width={{page_width}},
      page_height={{page_height}},
      aprx_path={{aprx_path}},
  )

  # 分级字段的空值不会上色（会默认为无色/白色），必须显式统计并报告，
  # 否则"未分析区域"与"数值为 0"在图上无法区分。
  _total = 0
  _null = 0
  with arcpy.da.SearchCursor(input_path, [field_name]) as _cur:
      for (_v,) in _cur:
          _total += 1
          if _v is None:
              _null += 1
  _null_rate = round(_null / _total, 4) if _total else 0.0
  if _null:
      print(f"⚠ 分级字段 {field_name} 有 {_null}/{_total} 个空值（{_null_rate:.1%}）：空值不会上色，"
            f"请在报告中说明这些单元\"无数据\"，不要当作 0")

  exec(compile(code, "<graduated_colors_map>", "exec"), globals(), globals())

  # 把空值统计补进执行结果（供上层报告/验收使用）
  _result = globals().get("__arcpy_engine_result__")
  if isinstance(_result, dict):
      _result.update({"null_count": _null, "total_count": _total, "null_rate": _null_rate})
      set_result(_result)
validation:
  - type: file_exists
    path: "{{output_path}}"
  - type: image_not_blank
    path: "{{output_path}}"
  - type: result_key_truthy
    key: "aprx_saved"
pitfalls:
  - 字段名必须是数据中的真实字段，不能写占位符。
  - 地图框必须绑定数据图层，否则导出空白图。
  - 工程(.aprx)必须 aprx.save() 落盘，否则样式/布局只在内存里，用户打开工程看不到分级色。
  - 默认每张图生成同名 .aprx（不覆盖其他图）；想追加到同一工程时传 aprx_path 指向已有工程（会复制再改，不改动原文件）。
  - 分级字段的空值不上色：若数据有大量空值（如"无绿地社区"），图上会大片留白，必须报告空值数量并改用全量图层出图，否则读者无法区分"无数据"与"已分析"。
  - 想给全量单元上色时，先用 attribute_join_table 把统计结果挂回全量图层（含空值）再出图。
examples:
  - "用 forest_cov 字段做绿色分级设色专题图"
  - "制作老年人口占比专题图，标题为‘某市老年人口占比’"
