id: am_task3a_city_aggregate_hotspot
name: AM 任务三(a) · 区县人口汇总到地市 + 历年热点/冷点探测（子任务，分钟级）
source: B上午
prompt: |
  完成以下操作，不要做其他事（所有产出必须放在 workspace/output/ 下）：
  1. population.CSV 只提供区县中心点经纬度（CenterLon/CenterLat）和 2011-2020 逐年人口，没有公共键。
     先将 CSV 转点（WGS84）并投影到 EPSG:4508，与 county 空间连接，得到
     workspace/output/result_data.gdb/county_pop（EPSG:4508，385 要素，含 Y2011..Y2020）。
     建议直接调用配方：run_recipe recipe_id=csv_points_spatial_join。
  2. 把 city 面要素投影到 EPSG:4508（run_recipe recipe_id=project_to_crs，target_srid=4508），
     输出 workspace/output/result_data.gdb/city_4508。
  3. 按空间位置把 county_pop 的 Y2011/Y2012/Y2013/Y2020 汇总（SUM）到每个地级市，
     结果回写到 city 面要素：workspace/output/result_data.gdb/city_pop
     （49 个地市，字段形如 SUM_Y2011..，同时生成 SRC_COUNT）。
     建议直接调用配方：run_recipe recipe_id=aggregate_to_zones
     （zones_path=city_4508, source_path=county_pop, stat_fields="Y2011,Y2012,Y2013,Y2020"）。
  4. 基于 city_pop，分别对 2011、2012、2013 年人口做热点分析（Getis-Ord Gi*），
     识别高值集聚（热点）与低值集聚（冷点）区域，输出三个要素类：
     workspace/output/result_data.gdb/city_hot_2011 / city_hot_2012 / city_hot_2013。
     建议直接调用配方：run_recipe recipe_id=hotspot_analysis（field_name=SUM_Y2011 等）。
  完成后说明方法：如何把区县归属到地市、汇总口径是什么、三年的热点/冷点各多少个。
inputs:
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/county.shp"
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/city.shp"
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/population.CSV"
requirements:
  - id: r1
    text: 区县人口汇总到地市并回写 city 面要素
    acceptance: city_pop 存在、49 要素、含 SUM_Y2011..SUM_Y2020 与 SRC_COUNT、EPSG:4508
  - id: r2
    text: 2011/2012/2013 三年热点/冷点探测
    acceptance: 三个热点分析要素类存在，含 Gi_Bin/GiZScore/GiPValue，且 Gi_Bin 不是单一取值
assertions:
  - type: vector_exists
    path: "output/result_data.gdb/city_pop"
  - type: crs_wkid
    path: "output/result_data.gdb/city_pop"
    value: 4508
  - type: feature_count_equal
    path: "output/result_data.gdb/city_pop"
    value: 49
  - type: fields_present
    path: "output/result_data.gdb/city_pop"
    value: ["SUM_Y2011", "SUM_Y2012", "SUM_Y2013", "SUM_Y2020", "SRC_COUNT"]
  - type: field_sum_gt
    path: "output/result_data.gdb/city_pop"
    field: "SRC_COUNT"
    value: 0
  - type: field_sum_gt
    path: "output/result_data.gdb/city_pop"
    field: "SUM_Y2011"
    value: 0
  - type: vector_exists
    path: "output/result_data.gdb/city_hot_2011"
  - type: vector_exists
    path: "output/result_data.gdb/city_hot_2012"
  - type: vector_exists
    path: "output/result_data.gdb/city_hot_2013"
  - type: fields_present
    path: "output/result_data.gdb/city_hot_2011"
    value: ["GiZScore", "GiPValue", "Gi_Bin"]
  - type: field_distinct_gt
    path: "output/result_data.gdb/city_hot_2011"
    field: "Gi_Bin"
    value: 1
  - type: field_distinct_gt
    path: "output/result_data.gdb/city_hot_2013"
    field: "Gi_Bin"
    value: 1
timeout_seconds: 1800