id: pm_task1_elderly_raster
name: PM 任务一 · 老年人口栅格模拟与分析（子任务，分钟级）
source: B下午
prompt: |
  完成以下操作，不要做其他事（所有产出必须放在 workspace/output 下）：
  0. 建立 workspace/output/result_data.gdb（建议 run_recipe recipe_id=create_file_gdb）。
  1. 把 district 面要素、community 面要素投影到 EPSG:4548（CGCS2000 3 度带 CM 117E），
     输出 workspace/output/result_data.gdb/district_prj 与 community_prj；
     把人口密度栅格 pop_density.tif 也投影到 4548、像元大小 5 米，输出 pop_density_prj。
     建议：run_recipe recipe_id=project_to_crs（矢量）；run_recipe recipe_id=project_raster（栅格）。
  2. 计算街区的老年人口：district 的「老年人」字段是百分比字符串（如 "28.3%"），
     人口字段是整数。注意 DBF 字段名可能被截断，请先用 catalog_query 确认真实字段名
     （本数据中人口字段实际名为「常住人」）。新建字段 ELDER_N = 人口 × 百分比/100（先去掉 % 再转数值）。
     建议：run_recipe recipe_id=field_calculate（在 district_prj 上，表达式形如
     float(!老年人![:-1])/100.0*float(!常住人口!)）。
  3. 模拟老年人口栅格（关键步骤，按像元权重分摊）：
     a) 街区老年人口转 5 米栅格 → elder_raster（run_recipe recipe_id=polygon_to_raster，value_field=ELDER_N）
     b) 统计每个街区内的人口密度总值为栅格 → zone_sum（run_recipe recipe_id=zonal_statistics_raster，
        zone_path=district_prj, raster_path=pop_density_prj, statistics=SUM）
     c) 分摊：像元值/街区内总值 × 街区老年人口 → elder_alloc
        （run_recipe recipe_id=raster_calculator，inputs 绑定 density/zone_sum/elder 三个栅格，
         表达式用 Con(IsNull(...)) 与 Con(...==0, 0, ...) 处理无值与除零）
     d) 补缺：把 elder_alloc 的 NoData 置 0 → elder_fill（run_recipe recipe_id=raster_calculator，
        表达式 Con(IsNull(alloc), 0, alloc)）
  4. 统计社区尺度老年人口：community_prj 用 OBJECTID 作为分区字段，
     对 elder_fill 做以表格显示分区统计（SUM），把结果挂回 community_prj，
     输出 workspace/output/result_data.gdb/community_elder，字段名 ELDER_COMM。
     建议：run_recipe recipe_id=zonal_statistics（输出表）+ attribute_join_table（按 OBJECTID 挂回）。
  完成后说明：分摊公式、栅格合计与街区老年人口总量的差异、社区尺度有多少单元没有值。
inputs:
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B下午/B下午/数据/district.shp"
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B下午/B下午/数据/community.shp"
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B下午/B下午/数据/pop_density.tif"
requirements:
  - id: r1
    text: 数据入库并统一到 EPSG:4548
    acceptance: district_prj/community_prj/pop_density_prj 存在且坐标系为 4548
  - id: r2
    text: 老年人口栅格分摊（守恒）
    acceptance: elder_fill 存在、非常量、栅格合计与街区老年人口总量误差 <1%、无 NoData
  - id: r3
    text: 社区尺度老年人口统计
    acceptance: community_elder 存在且含 ELDER_COMM 字段，合计≈栅格合计
assertions:
  - type: vector_exists
    path: "output/result_data.gdb/district_prj"
  - type: crs_wkid
    path: "output/result_data.gdb/district_prj"
    value: 4548
  - type: vector_exists
    path: "output/result_data.gdb/community_prj"
  - type: crs_wkid
    path: "output/result_data.gdb/community_prj"
    value: 4548
  - type: raster_exists
    path: "output/result_data.gdb/pop_density_prj"
  - type: raster_exists
    path: "output/result_data.gdb/elder_fill"
  - type: raster_not_constant
    path: "output/result_data.gdb/elder_fill"
  - type: raster_stat_between
    path: "output/result_data.gdb/elder_fill"
    stat: "sum"
    value: [688584, 702798]
  - type: raster_stat_between
    path: "output/result_data.gdb/elder_fill"
    stat: "nodata"
    value: [0, 5000]
  - type: vector_exists
    path: "output/result_data.gdb/community_elder"
  - type: fields_present
    path: "output/result_data.gdb/community_elder"
    value: ["ELDER_COMM"]
  - type: field_stats_between
    path: "output/result_data.gdb/community_elder"
    field: "ELDER_COMM"
    stat: "sum"
    value: [600000, 760000]
  - type: join_null_rate_below
    path: "output/result_data.gdb/community_elder"
    field: "ELDER_COMM"
    value: 0.1
timeout_seconds: 2700