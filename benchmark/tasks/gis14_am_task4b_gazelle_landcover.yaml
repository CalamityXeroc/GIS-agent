id: gis14_am_task4b_gazelle_landcover
name: 第14届（2025）上午 任务四b · 羚羊类分布与长颈鹿聚集性
source: A上午
prompt: |
  本工作区有清洗并投影后的野生动物点位 input/animal_points.shp（UTM 10N，
  字段 YEAR / COUNT / NAME / LON / LAT）与已裁切的土地覆盖栅格
  input/landcover_clip.tif（UTM 10N，10 m）。

     土地覆盖类别编码表（赛题表 2，报告里必须用这些名称）：
       1 水域 ｜ 2 林地 ｜ 4 淹没植被区 ｜ 5 耕地 ｜ 7 建筑区 ｜ 8 裸地 ｜
       9 雪/冰 ｜ 10 云 ｜ 11 牧场

  请完成（产出写到 workspace/output）：

  1. **长颈鹿分布的聚集性**：请选择合适的方法判断 1982–2001 年长颈鹿
     （NAME = 'Giraffe'）的分布模式是**聚集、离散还是随机**。
     建议用平均最近邻（Average Nearest Neighbor）：R < 1 且 Z 显著为负 → 聚集。
     要求：可以整体判定，也可以逐年给出（逐年更有说服力）；写出 R、Z、P 值与结论，
     存成 output/聚集性检验.md（或同名 .json），结论里必须明确出现"聚集/离散/随机"之一。

  2. **羚羊类逐年 × 土地覆盖类型分布比例表**：羚羊类指 Gazelle 与 Impala 两种。
     对每一年：把该年的羚羊类点位与 landcover_clip 叠加（按点位坐标取像元类别），
     统计**每个土地覆盖类别的点数与占比**（占比 = 该类点数 / 该年有效点数），
     所有年份汇总成一张表，写成 output/羚羊类分布比例.csv
     （列：年份、类别编码、类别名称、点数、占比；或每年一节的分块表均可），
     并在 output/羚羊类分布比例.md 里说明：数据口径（含无效值/落在研究区外的点数）、
     以及各类别占比随年份的变化。

  3.（加分，可选）分析羚羊类分布与土地覆盖、地形（dem_clip）、气候因子的关系，
     结论写进 output/羚羊类分布比例.md 的加分章节即可（不强制）。

  完成后请说明：长颈鹿聚集性结论与 R/Z 值、羚羊类各年主要分布的土地覆盖类别
  （占比最高的 2 类）、以及两张成果文件的路径。
inputs:
  - source: "workspace/input/第14届真题数据/animal_points.shp"
  - source: "workspace/input/第14届真题数据/landcover_clip.tif"
requirements:
  - id: r1
    text: 长颈鹿聚集性检验
    acceptance: 报告里给出方法、R/Z/P 与"聚集/离散/随机"结论
  - id: r2
    text: 羚羊类逐年 × 土地覆盖比例表
    acceptance: 比例表存在，各年占比合计≈1，主要类别为林地/牧场
assertions:
  - type: file_exists
    path: "output/聚集性检验.md"
  - type: file_contains
    path: "output/聚集性检验.md"
    value: "聚集"
  - type: file_contains
    path: "output/聚集性检验.md"
    value: "R"
  - type: file_exists
    path: "output/羚羊类分布比例.csv"
  - type: file_contains
    path: "output/羚羊类分布比例.csv"
    value: "林地"
  - type: file_contains
    path: "output/羚羊类分布比例.csv"
    value: "牧场"
  - type: file_exists
    path: "output/羚羊类分布比例.md"
  - type: deliverable_hygiene_ok
    path: "output"
    value:
      max_duplicate_families: 0
      forbid_suffixes: [".pkl", ".tmp", ".bak"]
      warn_temp_result_ratio: 8
timeout_seconds: 3000
