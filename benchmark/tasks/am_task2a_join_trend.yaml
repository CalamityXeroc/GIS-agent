id: am_task2a_join_trend
name: AM 任务二(a) · 数据挂接与条件查询（子任务，分钟级）
source: B上午
prompt: |
  完成以下操作，不要做其他事（所有产出必须放在 workspace/output/ 下）：
  1. population.CSV 只提供区县中心点经纬度（CenterLon/CenterLat）和 2011-2020 逐年人口，
     没有公共键。请先将 CSV 转为点要素（WGS84），投影到 EPSG:4508，再与 county 做空间连接，
     把十年人口字段（Y2011..Y2020）挂到 county 上。
  2. 在挂接结果上新增字段“F10年平均”：十年（2011-2020）人口的平均值，保留 2 位小数。
  3. 新增字段 trend_type：2011 年至 2020 年间人口每年都在增长（逐年递增）的区县赋值为 1，
     否则赋值为 0。
  4. 结果写入 workspace/output/result_data.gdb/county_pop，坐标系保持 EPSG:4508。
  完成后说明你的方法论（如何挂接、如何判定逐年递增），并用 set_result 返回 trend_type=1 的区县数量。
inputs:
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/county.shp"
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/population.CSV"
requirements:
  - id: r1
    text: population 十年数据挂接到 county
    acceptance: county_pop 含各年人口字段（Y2011..Y2020 或类似）
  - id: r2
    text: 新增 F10年平均 字段（十年均值）
    acceptance: 字段存在且为数值型
  - id: r3
    text: 新增 trend_type 字段（逐年递增=1，否则=0）
    acceptance: trend_type 取值仅 {0,1} 且两者都出现
  - id: r4
    text: 结果 385 个要素、EPSG:4508
    acceptance: count=385, wkid=4508
assertions:
  - type: vector_exists
    path: "output/result_data.gdb/county_pop"
  - type: crs_wkid
    path: "output/result_data.gdb/county_pop"
    value: 4508
  - type: feature_count_equal
    path: "output/result_data.gdb/county_pop"
    value: 385
  - type: fields_present
    path: "output/result_data.gdb/county_pop"
    value: ["trend_type"]
  - type: field_values_subset
    path: "output/result_data.gdb/county_pop"
    field: "trend_type"
    value: [0, 1]
timeout_seconds: 1500
