id: gis14_am_task4a1_density_maps
name: 第14届（2025）上午 任务四a-1 · 五年一期核密度图（统一图例）
source: A上午
prompt: |
  本工作区有清洗并投影后的野生动物点位 input/animal_points.shp（UTM 10N，
  字段 YEAR / COUNT / NAME / LON / LAT）与研究区矩形 input/study_area.shp。

  请做**每 5 年一期**的核密度（共 4 期：1982-1986、1987-1991、1992-1996、1997-2001）：
  - 搜索邻域**面积 100 km²**（半径 = √(面积/π) ≈ 5642 m），输出像元 100 m
  - 每期输出一个栅格：output/result_data.gdb/kde_1982_1986 等。直接用配方：
    run_recipe(recipe_id="kernel_density", points="input/animal_points.shp",
               out_dir="output/result_data.gdb",
               periods="1982-1986,1987-1991,1992-1996,1997-2001",
               neighborhood_area_km2=100, cell_size=100)
    它会算好半径、写栅格，并返回各期最大值与建议的统一分级边界。
  - 然后出 4 张密度图（JPG + 同名可编辑 .aprx）到 output/成果图/密度_1982_1986.jpg、
    密度_1987_1991.jpg、密度_1992_1996.jpg、密度_1997_2001.jpg，每张都要有
    图名/图例/比例尺/指北针。
    **必须用 graduated_colors_map 配方出这四张图**：它按 class_bounds 把分级写进工程渲染器，
    并把实测边界回写 .spec.json；验收会读 .spec.json 核对四图分级完全一致，
    自己直接调 create_map 得到的"自动分级"会被判不通过。照此调用：
    run_recipe(recipe_id="graduated_colors_map",
               input_path="output/result_data.gdb/kde_1982_1986",
               field_name="Value", output_path="output/成果图/密度_1982_1986.jpg",
               theme="野生动物核密度", region="研究区", scale="1982-1986",
               class_bounds="0,2,4,6,8")
    四张图必须传**完全相同**的 class_bounds；栅格输入不需要真实字段（配方已兼容）。
  - 出图后可用 view_image 自查中文、图例、比例尺是否正常。

  完成后请说明：4 期密度最大值、最终采用的统一分级边界、四张图的路径。
inputs:
  - source: "workspace/input/第14届真题数据/animal_points.shp"
  - source: "workspace/input/第14届真题数据/study_area.shp"
requirements:
  - id: r1
    text: 四期核密度栅格（100 km² 邻域、100 m 像元）
    acceptance: 4 个 kde_* 栅格存在且非常量
  - id: r2
    text: 4 张密度图共用同一图例
    acceptance: 4 份 .spec.json 的实测分级完全一致
assertions:
  - type: raster_not_constant
    path: "output/result_data.gdb/kde_1982_1986"
  - type: raster_not_constant
    path: "output/result_data.gdb/kde_1997_2001"
  - type: raster_stat_between
    path: "output/result_data.gdb/kde_1982_1986"
    stat: "max"
    value: [2.0, 12.0]
  - type: shared_legend_bounds
    path: "output/成果图"
    value: {"min_files": 4}
  - type: file_exists
    path: "output/成果图/密度_1997_2001.jpg"
  - type: image_not_blank
    path: "output/成果图/密度_1997_2001.jpg"
  - type: deliverable_hygiene_ok
    path: "output"
    value:
      max_duplicate_families: 0
      forbid_suffixes: [".pkl", ".tmp", ".bak"]
      warn_temp_result_ratio: 8
max_turns: 130
timeout_seconds: 4200