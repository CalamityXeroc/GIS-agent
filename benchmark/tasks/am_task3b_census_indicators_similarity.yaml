id: am_task3b_census_indicators_similarity
name: AM 任务三(b) · 普查三项指标汇总到地市 + 相似城市识别（子任务，分钟级）
source: B上午
prompt: |
  完成以下操作，不要做其他事（所有产出必须放在 workspace/output/ 下）：
  1. population.CSV 只提供区县中心点经纬度和逐年人口。先把它转点（WGS84）投影到 EPSG:4508，
     与 county 空间连接得到 workspace/output/result_data.gdb/county_pop（385 要素，含 Y2020）。
     建议：run_recipe recipe_id=csv_points_spatial_join。
  2. 把 city 面投影到 EPSG:4508：workspace/output/result_data.gdb/city_4508。
     建议：run_recipe recipe_id=project_to_crs（target_srid=4508）。
  3. 用 population_census.csv（列：name, code, centerlon, centerlat,
     F65岁及以上人口比重_百分比_, F15_49岁育龄妇女比重_百分比_, 男女性别比），
     按人口加权把三项指标汇总到地级市，输出 workspace/output/result_data.gdb/city_census
     （49 个地市，含 OLD_PCT 老年人占比、FERT_PCT 育龄女性占比、SEX_RATIO 性别比）。
     建议：run_recipe recipe_id=census_city_indicators
     （county_path=county_pop, census_csv=population_census.csv 路径, city_path=city_4508,
      output_path=city_census, pop_field=Y2020）。
  4. 找出与“郑州市”在这三个指标上最相似的地市，结果写到 workspace/output/similarity_zhengzhou.json。
     建议：run_recipe recipe_id=similarity_ranking
     （input_path=city_census, fields="OLD_PCT,FERT_PCT,SEX_RATIO", reference_name="郑州市",
      output_json=上述 json 路径）。
  5. 制作三张地市尺度的专题图（各含图名/图例/比例尺/指北针）：
     output/old_pct_map.jpg（老年人占比）、output/fert_pct_map.jpg（育龄女性占比）、
     output/sex_ratio_map.jpg（性别比）；
     每张图同时保存同名可编辑工程 output/old_pct_map.aprx / fert_pct_map.aprx / sex_ratio_map.aprx。
     建议：run_recipe recipe_id=graduated_colors_map 分别对三个字段出图（配方会自动保存 .aprx）。
  完成后说明：三项指标如何加权计算、与郑州最相似的地市是哪个及其依据。
inputs:
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/county.shp"
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/city.shp"
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/population.CSV"
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/population_census.csv"
requirements:
  - id: r1
    text: 普查三项指标按人口加权汇总到地市
    acceptance: city_census 存在、49 要素、含 OLD_PCT/FERT_PCT/SEX_RATIO
  - id: r2
    text: 找出与郑州市最相似的地市
    acceptance: JSON 结果存在且 most_similar 正确
  - id: r3
    text: 三张专题图（老年占比/育龄女性占比/性别比）+ 可编辑工程文件
    acceptance: 三张 JPG 存在且非空白；三个同名 .aprx 工程存在
assertions:
  - type: vector_exists
    path: "output/result_data.gdb/city_census"
  - type: crs_wkid
    path: "output/result_data.gdb/city_census"
    value: 4508
  - type: feature_count_equal
    path: "output/result_data.gdb/city_census"
    value: 49
  - type: fields_present
    path: "output/result_data.gdb/city_census"
    value: ["OLD_PCT", "FERT_PCT", "SEX_RATIO", "SRC_COUNT"]
  - type: field_sum_gt
    path: "output/result_data.gdb/city_census"
    field: "SRC_COUNT"
    value: 0
  - type: field_sum_gt
    path: "output/result_data.gdb/city_census"
    field: "SUM_Y2020"
    value: 0
  - type: file_exists
    path: "output/similarity_zhengzhou.json"
  - type: file_contains
    path: "output/similarity_zhengzhou.json"
    value: "长沙市"
  - type: file_exists
    path: "output/old_pct_map.jpg"
  - type: image_not_blank
    path: "output/old_pct_map.jpg"
  - type: file_exists
    path: "output/old_pct_map.aprx"
  - type: file_exists
    path: "output/fert_pct_map.jpg"
  - type: image_not_blank
    path: "output/fert_pct_map.jpg"
  - type: file_exists
    path: "output/fert_pct_map.aprx"
  - type: file_exists
    path: "output/sex_ratio_map.jpg"
  - type: image_not_blank
    path: "output/sex_ratio_map.jpg"
  - type: file_exists
    path: "output/sex_ratio_map.aprx"
timeout_seconds: 2400