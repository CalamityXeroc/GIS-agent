id: am_task1a_projection
name: AM 任务一(a) · 坐标系定义与真实投影（子任务，分钟级）
source: B上午
prompt: |
  完成以下两步，不要做其他事（所有产出必须放在 workspace/output/ 下）：
  1. 确认 county.shp 的坐标系为 WGS_1984 地理坐标系（EPSG:4326）；若不是则先定义。
     将结果写入 workspace/output/temp_data.gdb 中的 county_wgs84。
  2. 将其真实投影（Project，不是 DefineProjection 贴标签）到 CGCS2000 6 度带高斯-克吕格
     CM 111E（EPSG:4508），结果写入 workspace/output/result_data.gdb 中的 county。
  完成后简要说明你的方法论。
inputs:
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/county.shp"
requirements:
  - id: r1
    text: county 定义 WGS84 → 真实投影到 EPSG:4508
    acceptance: 投影后坐标必须是米级（GK 带内），且与原始度坐标不同
assertions:
  - type: vector_exists
    path: "output/result_data.gdb/county"
  - type: crs_wkid
    path: "output/result_data.gdb/county"
    value: 4508
  - type: feature_count_equal
    path: "output/result_data.gdb/county"
    value: 385
  - type: extent_matches_reference
    path: "output/result_data.gdb/county"
    reference: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/AM/AM/1-Process/result_data.gdb/county"
    tolerance: 1.0
  - type: fields_present
    path: "output/result_data.gdb/county"
    value: ["name", "code"]
timeout_seconds: 900
