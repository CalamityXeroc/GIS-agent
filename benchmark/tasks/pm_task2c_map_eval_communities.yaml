id: pm_task2c_map_eval_communities
name: PM 任务二c · 社区绿地评价成果图（交付 JPG + 可编辑 .aprx）
source: B下午
carry_from: pm_task2b_service_value_rank
prompt: |
  继续本工作区的工作。output/result_data.gdb 里已有前几步成果：
  - community_service（含 GREEN_AREA / PER_CAPITA / GREEN_IDX / SERVICE_VALUE / TOP_PER / TOP_SVC / BOT_PER / BOT_SVC）
  - 标杆社区（32 个，同时满足前 500 名人均绿地指数与绿地服务价值）
  - 需整改社区（500 个）
  若工作区有 .gis_agent/PROJECT_LOG.md，先读它了解口径，不要重复劳动。

  本步目标：出一张社区绿地服务评价成果图，要求（新产出放 workspace/output 下）：
  1. 把两个名单合并成一个分类字段：在 community_service 上新建字段「类别」，
     属于"标杆社区"清单的标为「标杆社区」、属于"需整改社区"清单的标为「需整改社区」、其余为「其他」。
     输出 workspace/output/result_data.gdb/community_eval。
  2. 出分类设色图（唯一值渲染器）：
     - 标杆社区 = 蓝色 #1F77B4
     - 需整改社区 = 绿色 #2CA02C
     - 其他 = 浅灰 #E8E8E8
     - 输出 workspace/output/成果图/社区绿地服务评价.jpg
     建议用 run_recipe recipe_id=category_map（input_path=community_eval、category_field=类别、
     category_colors="标杆社区:#1F77B4;需整改社区:#2CA02C"、other_color="#E8E8E8"、
     output_path=上述 jpg、title 自拟）。
  3. 制图交付必须同时给出可编辑的 .aprx 工程（category_map 默认与图片同名同目录生成，
     也可用 aprx_path 指定）；图上要有图名、图例、比例尺、指北针。
  完成后说明：三类各多少个社区、图片路径与工程路径、以及工程打开后能看到什么（渲染器与配色）。
requirements:
  - id: r1
    text: 合并出带「类别」字段的社区图层
    acceptance: community_eval 存在，三个类别要素数分别为 32 / 500 / 1809
  - id: r2
    text: 分类设色成果图
    acceptance: JPG 存在且非空白
  - id: r3
    text: 可编辑工程同步交付
    acceptance: 同名 .aprx 存在、渲染器为唯一值、标杆=#1F77B4 需整改=#2CA02C、布局四要素齐全
assertions:
  - type: vector_exists
    path: "output/result_data.gdb/community_eval"
  - type: fields_present
    path: "output/result_data.gdb/community_eval"
    value: ["类别"]
  - type: field_value_counts
    path: "output/result_data.gdb/community_eval"
    field: "类别"
    value: {"标杆社区": 32, "需整改社区": 500, "其他": 1809}
  - type: file_exists
    path: "output/成果图/社区绿地服务评价.jpg"
  - type: image_not_blank
    path: "output/成果图/社区绿地服务评价.jpg"
  - type: file_exists
    path: "output/成果图/社区绿地服务评价.aprx"
  - type: aprx_map_check
    path: "output/成果图/社区绿地服务评价.aprx"
    renderer: "UniqueValueRenderer"
    colors: "标杆社区=#1F77B4;需整改社区=#2CA02C"
    elements: ["图名", "图例", "比例尺", "指北针"]
timeout_seconds: 2700