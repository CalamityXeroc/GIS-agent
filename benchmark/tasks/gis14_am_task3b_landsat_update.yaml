id: gis14_am_task3b_landsat_update
name: 第14届（2025）上午 任务三b · 影像粗匹配与水系/建成区更新
source: A上午
prompt: |
  继续本工作区的工作。土地覆盖数据已裁切到研究区并在任务三a 中完成云区修补
  （output/result_data.gdb/landcover_fixed，UTM 10N，10 m，编码见下）。

     土地覆盖类别编码表（赛题表 2，必须按此命名，不要自己起名）：
       1 水域 WaterAreas ｜ 2 林地 Trees ｜ 4 淹没植被区 FloodedVegetationArea ｜
       5 耕地 Crops ｜ 7 建筑区 BuiltAreas ｜ 8 裸地 BareGroundAreas ｜
       9 雪/冰 SnoworIce ｜ 10 云 Clouds ｜ 11 牧场 RangelandsAreas

  本步处理遥感影像（input/ 目录与外部路径下的 Landsat.tif，6 波段，波段含义：
  Band1 Blue / Band2 Green / Band3 Red / Band4 Nir / Band5 Swir1 / Band6 Swir2；
  **影像没有空间参考**，分辨率 15 m）。

  请完成任务（产出写到 workspace/output）：

  1. **影像粗匹配**：影像缺乏空间参考，也没有地面控制点。请按"整幅影像与参考范围
     线性对应"的思路把它粗匹配到研究区（UTM 10N、15 m），并裁切到研究范围。
     注意：仅 DefineProjection + ProjectRaster 是**改不动范围**的（影像范围还是像素
     坐标 0~6000，被当成米），Clip 会报 ERROR 001566「裁剪要素超出栅格范围」；
     要按整幅↔目标范围做显式重采样。可用配方 run_recipe(recipe_id=image_coarse_match,
     input_path=影像路径, reference_path=研究区或已有栅格, output_path=...)。
     输出 output/result_data.gdb/landsat_matched（多波段）。

  2. **按观测区归一化**：对每个波段用**观测区（裁切后范围）**的 Min/Max 做
     Norm = (Band − Min) / (Max − Min)，结果落在 0~1。

  3. **提取水体与建成区**（用归一化后的波段）：
     - 水体：MNDWI = (GreenNorm − SWIR2Norm) / (GreenNorm + SWIR2Norm)，取 MNDWI > 0.4
       且**面积 > 0.1 km²** 的区域
     - 建成区：BU = (SWIR1Norm + SWIR2Norm) / (RedNorm + NIRNorm)，取 BU > 3 且**面积 > 1 km²** 的区域
     - 面积过滤做法：先按阈值二值化 → 8 邻域连通域（RegionGroup / scipy.ndimage.label）→
       用连通域像元数 × 像元面积（225 m²）过滤
     - 输出 output/result_data.gdb/water_mask 与 output/result_data.gdb/builtup_mask
       （值 1 = 命中，0 = 其他），并把**过滤前**的二值结果也各存一份
       （water_mask_raw / builtup_mask_raw）——因为按赛题阈值过滤后某个类别可能为空，
       报告里要说清"过滤前多少 km²、过滤后多少 km²"。

  4. **更新土地覆盖**：把水体命中处改为 1（水域）、建成区命中处改为 7（建筑区），
     其余保持不变；输出 output/result_data.gdb/landcover_updated（10 m、UTM 10N）。
     注意掩膜是 15 m 而土地覆盖是 10 m，需重采样到 10 m 网格（赛题注明分辨率损失可忽略）。

  5. **统计更新后各类土地覆盖面积（km²）**，写成 output/分类面积统计.md：
     每个类别一行（编码、赛题名称、像元数、面积 km²，按 10 m 像元），并给合计；
     同时说明更新前后水域/建筑区的面积变化。

  完成后请说明：匹配方式与假设、各波段归一化区间、水体与建成区的面积（过滤前/后）、
  更新前后水域与建筑区面积、以及总面积的守恒情况。
inputs:
  - source: "E:/GIS_documents/小火的竞赛资料/14第十四届全国大学生GIS应用技能大赛/14第十四届全国大学生GIS应用技能大赛/A上午/A上午/data/影像数据/Landsat.tif"
  - source: "workspace/input/第14届真题数据/study_area.shp"
  - source: "workspace/input/第14届真题数据/landcover_fixed.tif"
requirements:
  - id: r1
    text: 影像粗匹配并裁切到研究区
    acceptance: landsat_matched 存在、UTM 10N、15 m、范围落在研究区内
  - id: r2
    text: 按观测区归一化并提取水体/建成区（含面积过滤）
    acceptance: water_mask / builtup_mask 存在；报告给出过滤前后面积
  - id: r3
    text: 更新土地覆盖（水→1、建成→7）并统计面积
    acceptance: landcover_updated 存在；水域面积约 14.3 km²、总面积守恒约 2129 km²
assertions:
  - type: raster_not_constant
    path: "output/result_data.gdb/landsat_matched"
  - type: bbox_between
    path: "output/result_data.gdb/landsat_matched"
    value:
      xmin: [323000, 330000]
      ymin: [4531000, 4536000]
      xmax: [357000, 363000]
      ymax: [4594000, 4600000]
  - type: raster_not_constant
    path: "output/result_data.gdb/water_mask"
  - type: raster_class_counts_between
    path: "output/result_data.gdb/water_mask"
    scale: 0.000225
    value: {"1": [3.0, 16.0]}
  - type: raster_not_constant
    path: "output/result_data.gdb/builtup_mask_raw"
  - type: raster_class_counts_between
    path: "output/result_data.gdb/landcover_updated"
    scale: 0.0001
    value: {"1": [10.0, 20.0], "2": [1290.0, 1360.0], "7": [3.0, 6.5], "11": [420.0, 460.0]}
  - type: file_exists
    path: "output/分类面积统计.md"
  - type: file_contains
    path: "output/分类面积统计.md"
    value: "水域"
  - type: file_contains
    path: "output/分类面积统计.md"
    value: "建筑区"
  - type: deliverable_hygiene_ok
    path: "output"
    value:
      max_duplicate_families: 0
      forbid_suffixes: [".pkl", ".tmp", ".bak"]
      warn_temp_result_ratio: 8
timeout_seconds: 3000
