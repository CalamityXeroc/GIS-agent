id: gis14_am_task4a_density_migration
name: 第14届（2025）上午 任务四a · 五年一期核密度与分布中心迁移
source: A上午
prompt: |
  本工作区有清洗并投影后的野生动物点位 input/animal_points.shp（UTM 10N，
  字段 YEAR / COUNT / NAME / LON / LAT）与研究区矩形 input/study_area.shp。

  请完成两件事（产出写到 workspace/output）：

  1. **每 5 年一期核密度**（共 4 期：1982-1986、1987-1991、1992-1996、1997-2001）：
     - 搜索邻域**面积 100 km²**（半径 = √(面积/π) ≈ 5642 m），输出像元 100 m
     - 每期输出一个栅格（output/result_data.gdb/kde_1982_1986 等）
     - **4 张密度图必须共用同一图例**（统一分级才能横向对比）：先把 4 期密度值放一起
       确定统一分级边界（整数步长，覆盖各期最大值），然后在制图时用同一组
       class_bounds。可先用 run_recipe(recipe_id=kernel_density, points=…,
       out_dir=…, periods="1982-1986,1987-1991,1992-1996,1997-2001",
       neighborhood_area_km2=100, cell_size=100)，它会返回 suggested_bounds 供统一图例用。
     - 出 4 张密度图（JPG）：output/成果图/密度_1982_1986.jpg 等，每张都要有图名/图例/
       比例尺/指北针，并交付同名可编辑 .aprx。制图配方见 graduated_colors_map
       （参数 class_bounds 传统一分级边界）。

  2. **逐年分布中心与迁移图**：
     - 以年为单位（1982~2001，共 20 年）求每年的分布中心（平均中心），
       输出 output/result_data.gdb/year_centers（含 YEAR/X/Y/N）与
       output/result_data.gdb/migration_lines（相邻年连线，含 FROM_YEAR/TO_YEAR/DIST_M），
       另存 CSV output/分布中心.csv
     - 出**迁移图** output/成果图/分布中心迁移.jpg：要标出年份、有方向性（箭头），
       并交付 .aprx。做法：把连线要素加进地图后，用 create_map 的 intent["overlay"]
       传 arrows（数据坐标的 from/to）与 labels（各年中心坐标 + 年份文字），
       叠加层会把箭头与年份画到导出图上（年份标注与箭头标签二选一，别重复）。
     - 图例要说明箭头含义（例如"分布中心逐年迁移方向"）。

  完成后请说明：4 期的密度最大值、统一分级边界、20 个中心的迁移总量（km）、
  以及迁移图与密度图的路径。
inputs:
  - source: "workspace/input/第14届真题数据/animal_points.shp"
  - source: "workspace/input/第14届真题数据/study_area.shp"
requirements:
  - id: r1
    text: 四期核密度栅格（100 km² 邻域、100 m 像元）
    acceptance: 4 个 kde_* 栅格存在且非常量
  - id: r2
    text: 4 张密度图共用同一图例
    acceptance: 4 份 .spec.json 的实测分级完全一致
  - id: r3
    text: 逐年分布中心与迁移线
    acceptance: year_centers 20 个、migration_lines 19 段，中心范围落在研究区内
  - id: r4
    text: 迁移图（带年份与方向）
    acceptance: 迁移图 JPG 存在且非空白、版面体检通过
assertions:
  - type: raster_not_constant
    path: "output/result_data.gdb/kde_1982_1986"
  - type: raster_not_constant
    path: "output/result_data.gdb/kde_1997_2001"
  - type: raster_stat_between
    path: "output/result_data.gdb/kde_1982_1986"
    stat: "max"
    value: [2.0, 12.0]
  - type: vector_exists
    path: "output/result_data.gdb/year_centers"
  - type: feature_count_between
    path: "output/result_data.gdb/year_centers"
    value: [18, 20]
  - type: bbox_between
    path: "output/result_data.gdb/year_centers"
    value:
      xmin: [325000, 355000]
      ymin: [4533000, 4600000]
      xmax: [330000, 360000]
      ymax: [4534000, 4610000]
  - type: feature_count_between
    path: "output/result_data.gdb/migration_lines"
    value: [17, 19]
  - type: shared_legend_bounds
    path: "output/成果图"
    # 只比对 4 张密度图：任务书要求的是“4 张密度图共用同一图例”，
    # 迁移图是流向图（箭头 + 年份），本来就没有分级，不该被算进来。
    pattern: "密度_*.spec.json"
    value: {"min_files": 4}
  - type: file_exists
    path: "output/成果图/分布中心迁移.jpg"
  - type: image_not_blank
    path: "output/成果图/分布中心迁移.jpg"
  - type: map_layout_ok
    path: "output/成果图/分布中心迁移.aprx"
    image: "output/成果图/分布中心迁移.jpg"
  - type: deliverable_hygiene_ok
    path: "output"
    value:
      max_duplicate_families: 0
      forbid_suffixes: [".pkl", ".tmp", ".bak"]
      warn_temp_result_ratio: 8
timeout_seconds: 3600
max_turns: 120
