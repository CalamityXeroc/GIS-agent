id: am_task2b_neighbor_highlight
name: AM 任务二(b) · 邻接均值分析与高亮地图（子任务，分钟级）
source: B上午
prompt: |
  完成以下操作，不要做其他事（所有产出必须放在 workspace/output/ 下）：
  1. population.CSV 只提供区县中心点经纬度（CenterLon/CenterLat）和 2011-2020 逐年人口，
     没有公共键。请先将 CSV 转为点要素（WGS84）、投影到 EPSG:4508，再与 county 空间连接，
     把十年人口字段挂到 county 上，结果写入 workspace/output/result_data.gdb/county_pop
     （EPSG:4508，385 要素）。
  2. 基于 county_pop 的 2020 年人口字段（Y2020，先确认真实字段名），
     计算每个区县“自身 + 所有接壤区县”的 2020 人口均值，新增字段 NB_MEAN2020；
     新增字段 ABOVE_MEAN：自身人口 > 该均值 记 1，否则记 0。
  3. 制作高亮展示地图：对 county_pop 按 ABOVE_MEAN 字段做分级/唯一值符号化（1=高于均值用醒目颜色），
     地图包含图名、图例、比例尺、指北针四要素，导出为 workspace/output/county_highlight.jpg，
     并同时保存可继续编辑的工程文件 workspace/output/county_highlight.aprx（样式与布局已落盘，
     用户可直接用 ArcGIS Pro 打开修改）。
     建议直接调用已验证配方：run_recipe recipe_id=graduated_colors_map，
     params={{input_path: county_pop 路径, field_name: "ABOVE_MEAN", output_path: 上述 jpg 路径, title: "高于接壤区县均值区县分布图"}}
     （该配方会自动建工程、加四要素、导出 JPG 并保存同名 .aprx）。
  完成后说明你的方法论（邻接如何判定、均值是否含自身、标记了多少个区县）。
inputs:
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/county.shp"
  - source: "workspace/input/13第十三届全国大学生GIS应用技能大赛（兰州交通大学）/数据/B上午/B上午/数据/population.CSV"
requirements:
  - id: r1
    text: population 挂接到 county 得到 county_pop
    acceptance: 385 要素、EPSG:4508
  - id: r2
    text: 计算邻域均值 NB_MEAN2020 与比较标记 ABOVE_MEAN
    acceptance: 两字段存在，ABOVE_MEAN 取值仅 {0,1}，且 1 的数量大于 0
  - id: r3
    text: 高亮地图 JPG（含四要素）+ 可编辑工程文件
    acceptance: JPG 存在且非空白；同名 .aprx 工程存在（样式/布局已落盘）
assertions:
  - type: vector_exists
    path: "output/result_data.gdb/county_pop"
  - type: crs_wkid
    path: "output/result_data.gdb/county_pop"
    value: 4508
  - type: feature_count_equal
    path: "output/result_data.gdb/county_pop"
    value: 385
  - type: fields_present
    path: "output/result_data.gdb/county_pop"
    value: ["NB_MEAN2020", "ABOVE_MEAN"]
  - type: field_values_subset
    path: "output/result_data.gdb/county_pop"
    field: "ABOVE_MEAN"
    value: [0, 1]
  - type: file_exists
    path: "output/county_highlight.jpg"
  - type: image_not_blank
    path: "output/county_highlight.jpg"
  - type: file_exists
    path: "output/county_highlight.aprx"
timeout_seconds: 1800
