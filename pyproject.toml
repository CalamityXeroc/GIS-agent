[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-task-cli"
version = "0.8.0"
description = "General-purpose GIS task solving CLI for ArcGIS Pro workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GIS CLI Team" }]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.8.2",
  "rich>=13.0.0",
  "openai>=1.0.0",
  "litellm>=1.48.0",
  "json5>=0.9.25",
  "PyYAML>=6.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "chromadb>=0.5.5",
  "prompt-toolkit>=3.0.43",
  # 持久 Jupyter 内核（ArcPyKernel）：缺了就只能退回一次性子进程，
  # 每步重导 arcpy（~15s）且丢掉跨步变量。基准/CLI 跑在 venv 里时
  # 这一步曾经一直是“persistent kernel unavailable”（实测）。
  "jupyter-client>=8.0.0",
  # 图片读写与像素统计：验收器的图片非空白判定、版面体检、制图叠加层都要用。
  # 缺 Pillow 时验收只打印“image check 因缺少 PIL 不可用”；
  # 缺 numpy 时 image_not_blank **静默返回通过**（等于图面检查完全失效）。
  "pillow>=10.0.0",
  "numpy>=1.26",
  # 制图出图前检查 ArcGIS Pro 有没有开着（同时跑 GP 会互相干扰）
  "psutil>=5.9.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.111.1",
  "uvicorn>=0.30.5",
  "streamlit>=1.32.0",
]
office = [
  "python-docx>=1.1.2",
  "pypdf>=5.1.0",
]
dev = [
  "pytest>=8.3.2",
]

[project.scripts]
gis-cli = "gis_cli.cli:app"
gis-cli-api = "gis_cli.web.api:run"
gis-cli-ui = "gis_cli.web.ui_launcher:run"
gis-agent = "gis_cli.agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
